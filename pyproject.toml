[project]
name = "msc-intro-ai-graph-search"
version = "1.0.0"
description = "UCS, A*, and IDA* route finding over a supplied Israel road graph"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Kobie Hazon" },
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    "ways",
    "src/helper_types/Node.py",
    "src/helper_types/PriorityQueue.py",
    "src/utils/misc.py",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
line-ending = "lf"
